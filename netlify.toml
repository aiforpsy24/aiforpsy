[build]
  publish = "dist"


# Retired product delivery URLs return visitors to the existing sales page.
[[redirects]]
  from = "/:lang/products/personal-ai-operations-director/hub"
  to = "/:lang/products/personal-ai-operations-director/"
  status = 301
  force = true

[[redirects]]
  from = "/:lang/products/personal-ai-operations-director/hub/*"
  to = "/:lang/products/personal-ai-operations-director/"
  status = 301
  force = true

[[redirects]]
  from = "/:lang/products/personal-ai-operations-director/success"
  to = "/:lang/products/personal-ai-operations-director/"
  status = 301
  force = true

[[redirects]]
  from = "/:lang/products/personal-ai-operations-director/success/*"
  to = "/:lang/products/personal-ai-operations-director/"
  status = 301
  force = true

[[redirects]]
  from = "/:lang/products/personal-ai-operations-director/cancel"
  to = "/:lang/products/personal-ai-operations-director/"
  status = 301
  force = true

[[redirects]]
  from = "/:lang/products/personal-ai-operations-director/cancel/*"
  to = "/:lang/products/personal-ai-operations-director/"
  status = 301
  force = true
